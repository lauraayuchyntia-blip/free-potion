name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Free Potion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > android/app/free-potion-release.jks
          keytool -list -keystore android/app/free-potion-release.jks \
            -storepass freepotion2024 \
            -alias free-potion || { echo "ERROR: Keystore verification failed"; exit 1; }

      - name: Build APK (ARM64 Release)
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PATH: free-potion-release.jks
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: free-potion-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Free Potion ${{ github.ref_name }}
          body: |
            ## Free Potion ${{ github.ref_name }}
            🧪 Motion Graphics & Video Editor for Android
            ### Download
            - `app-release.apk` — ARM64 (semua HP modern)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
