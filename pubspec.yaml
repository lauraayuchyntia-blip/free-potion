name: free_potion
description: Free Potion - Motion Graphics & Video Editor, inspired by Alight Motion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  uuid: ^4.3.3
  image_picker: ^1.0.7
  video_player: ^2.8.3
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3
  just_audio: ^0.9.36
  permission_handler: ^11.3.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  reorderables: ^0.6.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/presets/
