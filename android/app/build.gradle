plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.freepotion.app"
    compileSdk 35
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            if (System.getenv("KEY_STORE_PASSWORD")) {
                keyAlias System.getenv("KEY_ALIAS") ?: "free-potion"
                keyPassword System.getenv("KEY_PASSWORD") ?: "freepotion2024"
                storeFile file(System.getenv("KEY_PATH") ?: "free-potion-release.jks")
                storePassword System.getenv("KEY_STORE_PASSWORD") ?: "freepotion2024"
            } else {
                keyAlias "androiddebugkey"
                keyPassword "android"
                storeFile file("${System.getenv('HOME')}/.android/debug.keystore")
                storePassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.freepotion.app"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
